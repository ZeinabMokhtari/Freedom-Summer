ght:300px}.flatview .title{font-size:58px}.flatview .exhibit{position:static;padding:0}.flatview .artifact .frame{max-height:48vh}.flatview .artifact .caption{font-size:17px}@media(max-width:850px){header,footer{padding:0 12px}.roomname,.navcenter .progress,.contentnote{display:none}.tools .ui{padding:8px}.flatview{grid-template-columns:1fr 1fr;padding:3vw;gap:12px}.flatview .title{font-size:34px}.flatview .description{font-size:16px}.flatview .stat{font-size:45px}.flatview .statlabel{font-size:14px}.flatview .sub{font-size:18px}.flatview .date{font-size:12px}.dialoggrid{grid-template-columns:1fr}.indexlist{grid-template-columns:1fr}.brand{letter-spacing:.08em}.next{min-width:0}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div id="app"><header><div class="brand">Freedom Summer <span>A journey through history · 1964</span></div><div class="tools"><button class="ui" id="index">Gallery index</button><button class="ui" id="viewmode">Reading view</button><button class="ui" id="fullscreen">⛶ Full screen</button></div></header><main id="viewport" aria-label="Three-dimensional historical museum"><div id="world"></div><div class="flatview" id="flatview"></div><div class="vignette"></div></main><footer><div><div class="footlabel">Current gallery</div><div class="roomname" id="roomname"></div></div><div class="navcenter"><span class="count" id="count" aria-live="polite"></span><div class="progress"><i id="progress"></i></div></div><div class="navgroup"><button class="ui" id="prev" aria-label="Previous gallery">← Back</button><button class="ui primary next" id="next">Journey to 1964 →</button></div></footer></div><div class="overlay" id="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogtitle"><button class="ui close" id="close" aria-label="Close dialog">✕</button><div id="dialogcontent"></div></section></div><script>const ROOMS=[{"date": "MISSISSIPPI · 1964", "title": "Freedom Summer", "sub": "By Zeinab Mokhtari", "kind": "entrance", "visual": {"src": "https://tile.loc.gov/storage-services/service/pnp/ppmsca/97700/97760v.jpg", "caption": "Fannie Lou Hamer · 1964", "credit": "Library of Congress, catalog record 2025160056. Consult record for rights.", "source": "https://www.loc.gov/pictures/item/2025160056/"}, "description": "A guided historical exhibition."}, {"date": "1962", "title": "A Right Denied", "sub": "The roots of inequality", "stat": "6.7%", "statLabel": "of eligible Black citizens in Mississippi were registered to vote.", "description": "Literacy tests, poll taxes and threats of violence prevented Black citizens from exercising their right to vote.", "visual": {"src": "https://upload.wikimedia.org/wikipedia/commons/d/d2/Map_of_USA_MS.svg", "caption": "", "credit": "Locator map based on Wapcaplet; CC BY-SA 3.0. Modern map, not a 1964 artifact.", "source": "https://commons.wikimedia.org/wiki/File:Map_of_USA_MS.svg"}, "detail": "Mississippi had one of the lowest Black voter registration rates in the United States. The highlighted state is Mississippi."}, {"date": "1961–1962", "title": "Change Begins Locally", "sub": "Grassroots organizing", "description": "Bob Moses left his teaching job in New York to organize voter registration. He listened to local communities and helped develop local leadership, even in the face of violence.", "visual": {"src": "https://upload.wikimedia.org/wikipedia/commons/c/ce/Robert_Parris_Moses.jpg", "caption": "Bob Moses", "credit": "Miller Center, 2014; CC BY 2.0. Later portrait.", "source": "https://commons.wikimedia.org/wiki/File:Robert_Parris_Moses.jpg"}, "detail": "Moses began organizing with local activists in McComb in 1961. Rural residents provided shelter, knowledge and the foundation for organizing."}, {"date": "1962–1963", "title": "What Was COFO?", "sub": "A coalition for change", "description": "The Council of Federated Organizations coordinated civil rights work in Mississippi. Together, its member organizations supported voter registration, education and political participation.", "kind": "coalition", "detail": "SNCC: Student Nonviolent Coordinating Committee. CORE: Congress of Racial Equality. NAACP: National Association for the Advancement of Colored People. SCLC: Southern Christian Leadership Conference."}, {"date": "1963", "title": "The Freedom Vote", "sub": "What if everyone could vote?", "stat": "80,000", "statLabel": "Black citizens participated in a symbolic election.", "description": "COFO organized a mock election to demonstrate that the desire to vote was real. The campaign helped lay the groundwork for Freedom Summer.", "kind": "ballot", "detail": "Participants symbolically voted for Aaron Henry and his running mate Ed King. This was a demonstration, not an official election."}, {"date": "1964 · PLANNING", "title": "A Summer of Action", "sub": "From a local movement to a national campaign", "description": "COFO planned a summer project to register Black voters across Mississippi. SNCC took a leading role, and Bob Moses directed the initiative.", "visual": {"src": "https://upload.wikimedia.org/wikipedia/commons/c/ce/Foner_%28Thomas%29_Freedom_Summer_papers_%22Program_for_-_%22_%289066414597%29.jpg", "caption": "Voter registration program · July 3, 1964", "credit": "Mississippi Department of Archives and History; rights information in archive record.", "source": "https://commons.wikimedia.org/wiki/File:Foner_%28Thomas%29_Freedom_Summer_papers_%22Program_for_-_%22_%289066414597%29.jpg"}, "detail": "The campaign sought to register voters, build educational opportunities and draw national attention to racial oppression."}, {"date": "APRIL 24, 1964", "title": "A National Responsibility", "sub": "Bob Moses at Stanford University", "description": "Moses argued that racial injustice was a national problem. Local organizers worried that outsiders might take over; after months of debate, volunteers were assigned specific roles.", "kind": "quote", "detail": "Moses emphasized listening to local residents and working alongside them. His Stanford speech explained why the summer project needed sustained commitment rather than temporary enthusiasm."}, {"date": "JUNE 1964", "title": "Volunteers Arrive", "sub": "Preparation and commitment", "stat": "~1,000", "statLabel": "volunteers from outside Mississippi joined the project.", "description": "Volunteers trained in Oxford, Ohio. About 90% were white. Organizers warned them that they could face arrest, beatings or death.", "visual": {"src": "https://upload.wikimedia.org/wikipedia/commons/5/54/1000_students_wanted_for_the_SNCC_Mississippi_Freedom_Summer_Project_%2826276560142%29.jpg", "caption": "Recruitment notice · Freedom Summer", "credit": "Mississippi Department of Archives and History; consult archive record for rights.", "source": "https://commons.wikimedia.org/wiki/File:1000_students_wanted_for_the_SNCC_Mississippi_Freedom_Summer_Project_%2826276560142%29.jpg"}, "detail": "The volunteers were trained before entering Mississippi, where local Black communities had already been organizing for years."}, {"date": "JUNE 21 – AUGUST 4, 1964", "title": "Three Lives Lost", "sub": "James Chaney · Andrew Goodman · Michael Schwerner", "description": "Three civil rights workers were arrested after visiting a burned Black church. After their release, Klansmen murdered them. Their bodies were found seven weeks later.", "visual": {"src": "https://upload.wikimedia.org/wikipedia/commons/c/cc/FBI_Poster_of_Missing_Civil_Rights_Workers.jpg", "caption": "FBI missing persons notice · June 29, 1964", "credit": "Federal Bureau of Investigation; US public domain.", "source": "https://commons.wikimedia.org/wiki/File:FBI_Poster_of_Missing_Civil_Rights_Workers.jpg"}, "kind": "memorial", "detail": "During the ten-week project, 1,062 people were arrested, 80 volunteers were beaten, 37 churches were bombed or burned, and 30 Black homes or businesses were bombed or burned. At least three other Black Mississippians were murdered for supporting the movement."}, {"date": "SUMMER 1964", "title": "Freedom Through Education", "sub": "Learning to question the world", "stat": "3,500+", "statLabel": "students attended more than 30 Freedom Schools.", "description": "Students studied Black history, constitutional rights and political skills. Nearly 50 Freedom Libraries opened. Teachers encouraged students to reflect on inequalities in their daily lives.", "kind": "school", "detail": "Moses proposed questions about housing, school facilities, libraries and opportunities. The goal was to help students recognize inequalities and think about their own lives. The average student was about 15 years old."}, {"date": "AUGUST 1964", "title": "Demanding a Voice", "sub": "Fannie Lou Hamer · Atlantic City", "description": "The Mississippi Freedom Democratic Party challenged the all-white state delegation. Hamer testified about racist violence. President Johnson interrupted live coverage, but broadcasters replayed her testimony.", "visual": {"src": "https://tile.loc.gov/storage-services/service/pnp/ppmsca/97700/97760v.jpg", "caption": "Fannie Lou Hamer · 1964", "credit": "Library of Congress, catalog record 2025160056. Consult record for rights.", "source": "https://www.loc.gov/pictures/item/2025160056/"}, "detail": "The MFDP did not replace the regular delegation. Nevertheless, the challenge exposed political exclusion nationwide. About 1,200 Black citizens had registered during the project, according to the classroom reading."}, {"date": "AUGUST 6, 1965", "title": "A Lasting Impact", "sub": "The Voting Rights Act", "description": "Freedom Summer helped build national pressure for the Voting Rights Act of 1965. The movement’s impact went beyond the number of voters registered during that summer.", "visual": {"src": "https://upload.wikimedia.org/wikipedia/commons/8/81/LyndonJohnson_signs_Voting_Rights_Act_of_1965.jpg", "caption": "Signing of the Voting Rights Act · August 6, 1965", "credit": "Yoichi Okamoto / LBJ Library, A1030-8a; public domain.", "source": "https://commons.wikimedia.org/wiki/File:LyndonJohnson_signs_Voting_Rights_Act_of_1965.jpg"}, "detail": "Seven men were convicted of federal crimes connected to the murders in 1967. Edgar Ray Killen was convicted of manslaughter in 2005. The struggle for equal participation continued beyond 1965."}];</script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),world=$('world'),viewport=$('viewport');const W=1700,H=850,D=1000,doorW=300,doorH=645,wallW=(W-doorW)/2,roomDepth=D;let current=0,cam=0,animation=0,returnFocus=null,flat=false;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;const rooms=[];
function el(tag,cls,parent){const n=document.createElement(tag);if(cls)n.className=cls;if(parent)parent.append(n);return n}function txt(tag,cls,text,parent){const n=el(tag,cls,parent);n.textContent=text;return n}function plane(parent,cls,w,h,x,y,z,rx=0,ry=0){const n=el('div','plane '+cls,parent);n.style.width=w+'px';n.style.height=h+'px';n.style.transform=`translate3d(${x-w/2}px,${y-h/2}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg)`;return n}
function artifact(r,parent,i){const b=el('button','artifact',parent);b.type='button';b.setAttribute('aria-label','Uncover the Story: '+(r.visual?.caption||r.title));b.onclick=()=>details(i);if(r.visual){const frame=el('div','frame',b),img=el('img','',frame);img.alt=r.visual.caption||'Map of the United States highlighting Mississippi';img.referrerPolicy='no-referrer';img.decoding='async';img.onerror=()=>{if(!img.dataset.retry&&r.visual.source?.includes('commons.wikimedia.org/wiki/File:')){img.dataset.retry='1';img.src=r.visual.source.replace('/wiki/File:','/wiki/Special:FilePath/');return}img.classList.add('failed');frame.classList.add('unavailable')};img.src=r.visual.src;txt('span','image-error','Archive image unavailable in this connection.',frame);if(r.visual.caption)txt('span','caption',r.visual.caption,b)}else{const o=el('div','object',b);if(r.kind==='coalition'){txt('b','','COFO',o);const g=el('div','coalition',o);['SNCC','CORE','NAACP','SCLC'].forEach(x=>txt('span','',x,g));txt('div','note','Coalition diagram · not an official logo',o)}else if(r.kind==='ballot'){const box=el('div','ballot',o);txt('div','','FREEDOM VOTE',box);txt('strong','','1963',box);txt('div','','✓  Aaron Henry',box);txt('div','','✓  Ed King',box);txt('span','note','Interpretive ballot · not an original document',o)}else if(r.kind==='school'){const chalk=el('div','chalk',o);['What is your school like?','Does it have a library?','What opportunities do you have?'].forEach(x=>txt('div','',x,chalk));txt('span','note','Questions adapted from Moses’s Stanford speech',o)}else{txt('div','quotation','A local struggle.\nA national responsibility.',o);txt('div','small','STANFORD UNIVERSITY · APRIL 1964',o);txt('span','note','Interpretive exhibit text',o)}}return b}
function copy(r,parent,i){const c=el('div','exhibit',parent);txt('div','date',r.date,c);txt('h2','title',r.title,c);txt('div','sub',r.sub,c);if(r.kind!=='entrance')txt('p','description',r.description,c);if(r.stat){txt('div','stat',r.stat,c);txt('div','statlabel',r.statLabel,c)}if(r.kind!=='entrance'){const b=txt('button','hotspot','Uncover the Story ↗',c);b.onclick=()=>details(i)}return c}
function journeyLabel(i){return i===0?'Journey to 1964':i===1?'Step Into History':i===ROOMS.length-2?'Discover the Legacy':'Continue the Journey'}
function build(){ROOMS.forEach((r,i)=>{const room=el('div','room',world);room.style.transform=`translateZ(${-i*D}px)`;rooms.push(room);const z=-D/2;plane(room,'floor',W,D,0,H/2,z+0.5,90);plane(room,'ceiling',W,D,0,-H/2,z,90);plane(room,'sidewall',D,H,-W/2,0,z,0,90);plane(room,'sidewall',D,H,W/2,0,z,0,-90);const left=plane(room,'wall '+(r.kind||''),wallW,H,-(W+doorW)/4,0,-D);const right=plane(room,'wall '+(r.kind||''),wallW,H,(W+doorW)/4,0,-D);copy(r,left,i);artifact(r,right,i);plane(room,'lintel',doorW,H-doorH,0,-doorH/2,-D);plane(room,'door',12,doorH,-doorW/2+6,(H-doorH)/2,-D+1);plane(room,'door',12,doorH,doorW/2-6,(H-doorH)/2,-D+1);plane(room,'trim',doorW,8,0,H/2-5,-D+3);if(i<ROOMS.length-1){const hit=plane(room,'portal-plane',doorW-26,doorH-10,0,(H-doorH)/2,-D+3);const b=el('button','portal-hit',hit);b.setAttribute('aria-label',journeyLabel(i));txt('span','',journeyLabel(i)+' →',b);b.onclick=()=>go(i+1)}if(i===ROOMS.length-1){const last=plane(room,'wall',doorW,doorH,0,(H-doorH)/2,-D-8);const t=el('div','object',last);txt('div','small','END OF EXHIBITION',t)}[-470,470].forEach(x=>{const l=plane(room,'light',74,10,x,-H/2+9,-D+150,90);l.style.borderRadius='50%'})})}
function setCam(z){cam=z;world.style.transform=`translate3d(0,0,${z}px)`;rooms.forEach((r,i)=>{const wallZ=(i+1)*D; r.style.visibility=(wallZ<z-30||wallZ>z+5*D)?'hidden':'visible';r.style.pointerEvents=i===current?'auto':'none'})}
function target(i){return i*D+230}function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;const p=Math.max(680,Math.min(w*.94,1550));viewport.style.perspective=p+'px';// scale world uniformly using zoom-equivalent transform on camera through CSS scale
const projected=p/(p+770);const fit=Math.min(w/(W*projected)*.98,h/(H*projected)*.98,1);world.style.setProperty('--fit',fit);world.style.transformOrigin='0 0';world.style.scale=String(fit);if(!flat&&w<700)setFlat(true)}
function update(){const r=ROOMS[current];$('roomname').textContent=r.title;$('count').textContent=String(current+1).padStart(2,'0')+' / '+ROOMS.length;$('progress').style.width=((current+1)/ROOMS.length*100)+'%';$('prev').disabled=current===0;$('next').textContent=current===ROOMS.length-1?'Restart ↻':journeyLabel(current)+' →';if(flat)renderFlat();rooms.forEach((n,i)=>{n.inert=i!==current})}
function go(i){i=Math.max(0,Math.min(ROOMS.length-1,i));const from=cam,to=target(i);current=i;update();cancelAnimationFrame(animation);if(reduce||flat){setCam(to);return}const start=performance.now(),duration=Math.min(1500,950+Math.abs(to-from)*.12);function tick(now){let t=Math.min(1,(now-start)/duration);let e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;setCam(from+(to-from)*e);if(t<1)animation=requestAnimationFrame(tick);else setCam(to)}animation=requestAnimationFrame(tick)}
